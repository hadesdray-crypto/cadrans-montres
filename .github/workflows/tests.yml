name: Tests Cadrans
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  unitaires:
    name: Tests unitaires et fabrication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Tests unitaires et APK
        run: gradle testDebugUnitTest assembleDebug lintDebug --no-daemon --console=plain

  appareils:
    name: Android ${{ matrix.nom }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unitaires
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: "7 (API 24) petit telephone",  api: 24, cible: default,     profil: "Nexus 5X",   police: "1.0", sombre: "no" }
          - { nom: "11 (API 30)",                 api: 30, cible: google_apis, profil: "pixel_4",    police: "1.0", sombre: "no" }
          - { nom: "14 (API 34) police maxi",     api: 34, cible: google_apis, profil: "pixel_6",    police: "2.0", sombre: "yes" }
    steps:
      - uses: actions/checkout@v4
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Appareil virtuel et parcours
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.cible }}
          arch: x86_64
          profile: ${{ matrix.profil }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash outils/tester-emulateur.sh ${{ matrix.police }} ${{ matrix.sombre }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-api${{ matrix.api }}
          path: sortie
          if-no-files-found: ignore